[project]
name = "doupool"
version = "0.1.0"
description = "Local Doubao multi-account video manager (DoubaoManager)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
  "pywebview>=5.4,<7",
  "playwright>=1.54,<2",
  "peewee>=3.18,<4",
  "platformdirs>=4.3,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "httpx>=0.28,<1",
  "pyinstaller>=6.12,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doupool"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

