name: Build DouStudio Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 所有 step 默认 bash:windows-latest 默认是 pwsh,但这里所有命令都是 bash 风格
# (apt / python / curl / mv 等),统一在 bash 下执行最稳
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build & Upload ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plat: windows-x86_64
            artifact_name: DouStudio-windows-x86_64
          - os: ubuntu-latest
            plat: linux-x86_64
            artifact_name: DouStudio-linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Linux runner 需要 gtk/webkit 给 PyWebView 用
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 python3-gi gir1.2-gtk-3.0 xvfb

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.12.0
          pip install -e .

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Linux 装 Playwright Chromium 浏览器(让 linux 用户首次启动即可用)
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m playwright install chromium

      # Windows 装 Playwright Chromium(同样让 windows 用户首次启动即可用)
      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m playwright install chromium
          python -m playwright install --with-deps chromium || true

      # 构建 onedir + 自动上传 zip + sha256 到 GitHub Release
      # build_exe.py 用纯 urllib 打 GitHub API,不依赖 gh CLI
      - name: Build onedir + upload to release
        env:
          DOUSTUDIO_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/build_exe.py --mode onedir --version "$DOUSTUDIO_VERSION" --upload

      # 双保险:即使 --upload 失败,artifact 仍可手动从 workflow run 下载
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/DouStudio-v*.zip
            dist/DouStudio-v*.zip.sha256
          if-no-files-found: error
          retention-days: 30