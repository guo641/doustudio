name: Build DouStudio Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Package DouStudio (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.12.0
          pip install -e .

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build DouStudio onedir
        env:
          DOUSTUDIO_VERSION: ${{ github.ref_name }}
        run: |
          python scripts/build_exe.py --mode onedir --version "$DOUSTUDIO_VERSION" --upload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouStudio-windows-x64
          path: |
            dist/DouStudio-v*.zip
            dist/DouStudio-v*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Package DouStudio (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (PyWebView GTK + Playwright)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 python3-gi gir1.2-gtk-3.0
          sudo apt-get install -y xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.12.0
          pip install -e .

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build DouStudio onedir
        env:
          DOUSTUDIO_VERSION: ${{ github.ref_name }}
        run: |
          python scripts/build_exe.py --mode onedir --version "$DOUSTUDIO_VERSION" --upload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouStudio-linux-x86_64
          path: |
            dist/DouStudio-v*.zip
            dist/DouStudio-v*.zip.sha256
          if-no-files-found: error
          retention-days: 30
